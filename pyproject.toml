[project]
name = "ai-assistant-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ansen01-svg", email = "ansenbeyc73@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.13.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.142.2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.3",
]

[project.scripts]
ai-assistant-server = "ai_assistant_server:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
